<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeType</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font: 15px/1.6 -apple-system, system-ui, sans-serif;
           background: #131418; color: #f0f1f5; }
    main { max-width: 32rem; padding: 2rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    p { color: #a0a5b3; }
    code { background: #1d1e24; padding: .1rem .35rem; border-radius: .3rem; }
    a { color: #7c7ff2; }
  </style>
</head>
<body>
  <main>
    <h1>WeType</h1>
    <p>On-device autocomplete for macOS. This site hosts WeType's update feed and in-app
       announcements — it is not the app itself.</p>
    <p>Feed: <code>/wetype/announcements.json</code></p>
  </main>
</body>
</html>
